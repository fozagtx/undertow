services:
  - type: web
    name: undertow
    runtime: node
    region: oregon
    plan: free
    buildCommand: bun install
    startCommand: bun run index.ts
    healthCheckPath: /metrics
    envVars:
      - key: BUN_VERSION
        value: 1.4.0
      - key: SOLAMI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
